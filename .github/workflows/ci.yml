name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l ./*.go ./cmd ./internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -o ./bin/pylon ./cmd/pylon
